name: Books
version: "0.2.0"
slug: books
description: Catalogue your book collection — ISBN & author/title lookup, barcode scanning, CLZ import
url: https://github.com/eddysteurs/books
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bookshelf
panel_title: Books
homeassistant_api: true
backup: hot
options:
  language: nl
  google_books_api_key: ""
  publish_sensors: true
  cache_covers: true
schema:
  language: str
  google_books_api_key: str?
  publish_sensors: bool
  cache_covers: bool
